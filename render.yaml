services:
  - type: web
    name: monthly-report-system
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 4173
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: monthly-report-db
          property: connectionString

databases:
  - name: monthly-report-db
    plan: free
