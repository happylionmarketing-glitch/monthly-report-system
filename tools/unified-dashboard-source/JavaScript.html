    function mergeState(base, extra) {
      var output = {};
      Object.keys(base || {}).forEach(function (key) {
        output[key] = base[key];
      });
      Object.keys(extra || {}).forEach(function (key) {
        output[key] = extra[key];
      });
      return output;
    }

    function cloneObject(value) {
      return JSON.parse(JSON.stringify(value || {}));

    function loadState() {
      try {
        var raw = localStorage.getItem(storageKey);
        return raw ? JSON.parse(raw) : {};
      } catch (error) {
        return {};

    }

    function saveState() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(state));

    function normalizeRoute(value) {
      var key = String(value || '').trim().toLowerCase();
      if (key === 'monthly' || key === 'payroll' || key === 'operations' || key === 'home') {
        return key;
      }
      return 'home';
    }

    function readUrlState() {
      var params = new URLSearchParams(window.location.search || '');
      var rawRoute = params.get('page') || params.get('route') || params.get('view') || '';
      var urlState = {};
      if (rawRoute) {
        urlState.route = normalizeRoute(rawRoute);
        if (urlState.route === 'home') urlState.scope = 'all';
      }
      if (params.has('branch')) urlState.branch = String(params.get('branch') || '').trim();
      if (params.has('period') || params.has('month')) {
        urlState.period = String(params.get('period') || params.get('month') || '').trim();
      }
      if (params.has('keyword') || params.has('search')) {
        urlState.keyword = String(params.get('keyword') || params.get('search') || '').trim();
      }
      return urlState;
    }

    function buildUrlFromBase(baseHref, overrides) {
      var nextState = mergeState(state, overrides || {});
      var url = new URL(baseHref || window.location.href, window.location.href);
      var route = normalizeRoute(nextState.route);

      url.searchParams.set('page', route);
      if (nextState.branch && nextState.branch !== getAllBranchLabel()) {
        url.searchParams.set('branch', nextState.branch);
      } else {
        url.searchParams.delete('branch');
      }
      if (nextState.period) {
        url.searchParams.set('period', nextState.period);
      } else {
        url.searchParams.delete('period');
      }
      if (nextState.keyword) {
        url.searchParams.set('keyword', nextState.keyword);
      } else {
        url.searchParams.delete('keyword');
      }
      url.hash = '';
      return url.toString();
    }

    function buildShareUrl(overrides) {
      return buildUrlFromBase(publicWebAppUrl || window.location.href, overrides);

    function syncUrlState(usePushState) {
      var nextUrl = buildUrlFromBase(window.location.href);
      if (usePushState && window.history && window.history.pushState) {
        window.history.pushState({}, '', nextUrl);
        return;
      }
      if (window.history && window.history.replaceState) {
        window.history.replaceState({}, '', nextUrl);
      }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatDateTime(value) {
      if (!value) return '-';
      var text = String(value).trim();
      if (!text) return '-';
      if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(text)) return text;

      var parsed = new Date(text);
      if (isNaN(parsed.getTime())) {
        return text.replace('T', ' ').replace('.000Z', '').slice(0, 16);
      }

      var parts = new Intl.DateTimeFormat('sv-SE', {
        timeZone: 'Asia/Taipei',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).formatToParts(parsed).reduce(function (result, part) {
        result[part.type] = part.value;
        return result;
      }, {});

      return [parts.year, parts.month, parts.day].join('-') + ' ' + [parts.hour, parts.minute].join(':');
    }

    function formatCurrency(value) {
      var numberValue = Number(value || 0);
      if (!numberValue) return '-';
      return 'NT$' + numberValue.toLocaleString('en-US');
    }

    function formatSignedNumber(value) {
      var numberValue = Number(value || 0);
      if (numberValue > 0) return '+' + numberValue;
      if (numberValue < 0) return String(numberValue);
      return '0';
    }

    function formatPercent(value) {
      return Math.round(Number(value || 0)) + '%';
    }

    function localizeText(text) {
      var output = String(text == null ? '' : text);
      localizationPairs.forEach(function (pair) {
        output = output.split(pair[0]).join(pair[1]);
      });
      output = output.replace(/\bBranch A\b/g, '分校 A');
      output = output.replace(/\bBranch B\b/g, '分校 B');
      output = output.replace(/\bConfirmed\b/g, '已確認');
      output = output.replace(/\bManager Pending\b/g, '主管待審');
      output = output.replace(/\bAnomaly Count\b/g, '異常筆數');
      output = output.replace(/\bLoaded Periods\b/g, '已載入期別');
      return output;
    }

    function localizeDom(root) {
      var scope = root || document.body;
      if (!scope) return;
      var walker = document.createTreeWalker(scope, NodeFilter.SHOW_TEXT, null, false);
      var textNodes = [];
      while (walker.nextNode()) textNodes.push(walker.currentNode);
      textNodes.forEach(function (node) {
        var nextValue = localizeText(node.nodeValue);
        if (nextValue !== node.nodeValue) node.nodeValue = nextValue;
      });

      Array.prototype.slice.call(scope.querySelectorAll('[data-detail-title],[data-detail-body],[data-detail-meta],[title],[aria-label]')).forEach(function (node) {
        ['data-detail-title', 'data-detail-body', 'data-detail-meta', 'title', 'aria-label'].forEach(function (attr) {
          if (node.hasAttribute && node.hasAttribute(attr)) {
            var value = node.getAttribute(attr);
            var next = localizeText(value);
            if (next !== value) node.setAttribute(attr, next);
          }
        });
      });
    }

    function showToast(message) {
      if (!dom.toast) return;
      dom.toast.textContent = localizeText(message);
      dom.toast.hidden = false;
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(function () {
        dom.toast.hidden = true;
      }, 2200);
    }

    function openDetail(title, body, meta) {
      if (dom.detailTitle) dom.detailTitle.textContent = localizeText(title || '明細');
      if (dom.detailBody) dom.detailBody.textContent = localizeText(body || '請選擇左側項目查看內容。');
      if (dom.detailMeta) dom.detailMeta.textContent = localizeText(meta || '');
    }

    function getAllBranchLabel() {
      var branches = (data.shared && data.shared.branches) || [];
      return branches[0] && branches[0].branch_name ? branches[0].branch_name : '全部分校';
    }

    function getMasterBranchNames() {

      return ((data.shared && data.shared.branches) || [])
        .map(function (item) { return item.branch_name; })
        .filter(function (name) {
          return name && name !== getAllBranchLabel();
        });
    }

    function isAllBranchSelected() {
      return !state.branch || state.branch === getAllBranchLabel();
    }

    function branchMatches(item) {
      var names = Array.isArray(item.branch_names) ? item.branch_names : [];
      return isAllBranchSelected() || !item.branch_name || item.branch_name === state.branch || names.indexOf(state.branch) >= 0;
    }

    function periodMatches(item) {
      return !item.period_id || item.period_id === state.period;
    }

    function filterItems(items) {
      return (items || []).filter(function (item) {
        return branchMatches(item) && periodMatches(item);
      });
    }

    function collectUniqueValues(rows, key) {
      var lookup = {};
      (rows || []).forEach(function (item) {
        if (item && item[key]) lookup[item[key]] = true;
      });
      return Object.keys(lookup);
    }

    function sortDescByPeriod(rows) {
      return (rows || []).slice().sort(function (a, b) {
        return String(b.period_id || '').localeCompare(String(a.period_id || ''));
      });
    }

    function ensureSelectedValue(currentValue, options, fallbackValue) {
      if (currentValue && options.indexOf(currentValue) >= 0) return currentValue;
      if (fallbackValue && options.indexOf(fallbackValue) >= 0) return fallbackValue;
      return options.length ? options[0] : fallbackValue || '';
    }

    function tagHtml(status) {
      var classMap = {
        draft: 'tag-draft',
        submitted: 'tag-submitted',
        reviewed: 'tag-reviewed',
        needs_revision: 'tag-revision',
        missing: 'tag-revision',
        confirmed: 'tag-reviewed',
        teacher_pending: 'tag-submitted',
        manager_review: 'tag-submitted',
        needs_fix: 'tag-revision'
      };
      return '<span class="tag ' + (classMap[status] || 'tag-draft') + '">' + escapeHtml(statusLabels[status] || status || '-') + '</span>';
    }

        function layoutWrap(content) {

    function summarizeMonthlyRows(rows) {
      return (rows || []).reduce(function (summary, item) {
        summary.period_id = summary.period_id || item.period_id || state.period;
        summary.expected_reports += Number(item.expected_reports || 0);
        summary.draft_reports += Number(item.draft_reports || 0);
        summary.submitted_reports += Number(item.submitted_reports || 0);
        summary.reviewed_reports += Number(item.reviewed_reports || 0);
        summary.needs_revision_reports += Number(item.needs_revision_reports || 0);
        summary.pending_total += Number(item.pending_total || 0);
        return summary;
      }, {
        period_id: state.period,
        expected_reports: 0,
        draft_reports: 0,
        submitted_reports: 0,
        reviewed_reports: 0,
        needs_revision_reports: 0,
        pending_total: 0

    }

    function buildMonthlyStatusLabel(status) {
      var labels = {
        draft: '草稿',
        submitted: '已送出',
        reviewed: '已審核',
        needs_revision: '需修正',
        missing: '缺件'
      };
      return labels[status] || statusLabels[status] || status || '-';

    function parseJson(value) {
      if (!value) return {};
      if (typeof value === 'object') return value;
      try {
        return JSON.parse(String(value));
      } catch (error) {
        return {};
      }
    }

    function formatMonthlyValue(value, depth) {
      var currentDepth = depth || 0;
      if (value === null || value === undefined || value === '') return '';
      if (currentDepth > 2) return Array.isArray(value) ? '多筆資料' : '[物件]';

      if (Array.isArray(value)) {
        if (!value.length) return '0 筆';
        return value.slice(0, 3).map(function (item) {
          return formatMonthlyValue(item, currentDepth + 1);
        }).filter(Boolean).join(' / ');
      }

      if (typeof value === 'object') {
        return Object.keys(value).slice(0, 5).map(function (key) {
          return key + ':' + formatMonthlyValue(value[key], currentDepth + 1);
        }).filter(Boolean).join(' / ');
      }

      return String(value).replace(/\[object Object\]/g, '[物件]');
    }

    function summarizeMonthlyReportData(raw) {
      var parsed = parseJson(raw);
      if (!parsed || (typeof parsed === 'object' && !Array.isArray(parsed) && !Object.keys(parsed).length)) {
        return { text: '', searchable: '', breakdown: [] };
      }

      if (Array.isArray(parsed)) {
        var preview = parsed.slice(0, 3).map(function (item) {
          return formatMonthlyValue(item);
        }).join(' / ');
        return {
          text: 'Array data: ' + parsed.length + ' items' + (preview ? '. ' + preview : ''),
          searchable: preview,
          breakdown: [{ label: 'Array', value: parsed.length + ' items' }]
        };
      }

      var sections = [];
      var searchable = [];
      Object.keys(parsed).slice(0, 8).forEach(function (key) {
        var value = parsed[key];
        if (value === null || value === undefined || value === '') return;
        var textValue = formatMonthlyValue(value);
        sections.push(key + ': ' + textValue);
        searchable.push(key + ' ' + textValue);
      });

      return {
        text: sections.join('\n'),
        searchable: searchable.join(' '),
        breakdown: sections.map(function (item) {
          var parts = item.split(': ');
          return { label: parts[0], value: parts.slice(1).join(': ') };
        })
      };
    }

    function summarizeMonthlyReviewHistory(raw) {
      var parsed = parseJson(raw);
      var items = [];
      if (Array.isArray(parsed)) {
        items = parsed;
      } else if (parsed && Array.isArray(parsed.history)) {
        items = parsed.history;
      } else if (parsed && Array.isArray(parsed.items)) {
        items = parsed.items;
      } else if (parsed && Array.isArray(parsed.records)) {
        items = parsed.records;
      } else if (parsed && Object.keys(parsed).length) {
        items = [parsed];
      } else if (raw) {
        items = [{ note: String(raw) }];
      }

      var normalized = items.map(function (item) {
        var row = typeof item === 'object' ? item : { note: String(item) };
        return {
          reviewer: row.reviewer || row.reviewer_name || row.reviewerName || row.name || '',
          reviewed_at: formatDateTime(row.reviewed_at || row.reviewedAt || row.time || row.timestamp || ''),
          note: row.note || row.comment || row.message || row.review_note || row.reviewerNote || formatMonthlyValue(item),
          status: row.status || row.result || ''
        };
      });

      var text = normalized.map(function (item) {
        return [item.reviewed_at, item.reviewer, item.status, item.note].filter(Boolean).join(' ');
      }).filter(Boolean).join('\n');

      return {
        items: normalized,
        text: text,
        latest_note: normalized.length ? (normalized[0].note || '') : '',
        searchable: text
      };
    }

    function summarizeMonthlyScores(raw) {
      var parsed = parseJson(raw);
      var breakdown = [];
      if (!parsed || (typeof parsed === 'object' && !Array.isArray(parsed) && !Object.keys(parsed).length)) {
        return { text: '', searchable: '', breakdown: [] };
      }

      if (Array.isArray(parsed)) {
        parsed.slice(0, 6).forEach(function (item, index) {
          breakdown.push({ label: '#' + (index + 1), value: formatMonthlyValue(item) });
        });
      } else {
        Object.keys(parsed).slice(0, 8).forEach(function (key) {
          var value = parsed[key];
          if (value === null || value === undefined || value === '') return;
          breakdown.push({ label: key, value: formatMonthlyValue(value) });
        });
      }

      return {
        text: breakdown.map(function (item) {
          return item.label + ': ' + item.value;
        }).join('\n'),
        searchable: breakdown.map(function (item) {
          return item.label + ' ' + item.value;
        }).join(' '),
        breakdown: breakdown
      };
    }

    function buildMonthlyDetailBody(item) {
      var lines = [
        '分校：' + formatMonthlyValue(item.branch_name || '-'),
        '老師：' + formatMonthlyValue(item.employee_name || '-'),
        '角色：' + formatMonthlyValue(item.role_type || '-'),
        '狀態：' + buildMonthlyStatusLabel(item.status),
        '送出時間：' + formatMonthlyValue(item.submitted_at || '-'),
        '審核時間：' + formatMonthlyValue(item.reviewed_at || '-'),
        '下一步：' + formatMonthlyValue(item.next_step || '-')
      ];
      if (item.review_note) lines.push('審核備註：' + formatMonthlyValue(item.review_note));
      if (item.review_history_text) lines.push('審核歷程：' + formatMonthlyValue(item.review_history_text));
      if (item.data_summary) lines.push('月報內容：' + formatMonthlyValue(item.data_summary));
      if (item.score_summary) lines.push('評分摘要：' + formatMonthlyValue(item.score_summary));
      return lines.join('\n');
    }

    function getMonthlyReportIndex(reports) {
      return (reports || []).reduce(function (index, item) {
        var periodId = String(item.period_id || '');
        var keys = [];
        if (item.user_id) keys.push(String(item.user_id) + '::' + periodId);
        if (item.employee_name) keys.push(String(item.employee_name) + '::' + periodId);
        if (item.staff_code) keys.push(String(item.staff_code) + '::' + periodId);
        keys.forEach(function (key) {
          if (key && !index[key]) index[key] = item;
        });
        return index;
      }, {});
    }

    function collectMonthlyRosterPeriods(reports, roster) {
      var periods = collectUniqueValues((data.shared && data.shared.periods) || [], 'period_id');
      collectUniqueValues(reports || [], 'period_id').forEach(function (periodId) {
        if (periods.indexOf(periodId) < 0) periods.push(periodId);
      });
      collectUniqueValues(roster || [], 'period_id').forEach(function (periodId) {
        if (periods.indexOf(periodId) < 0) periods.push(periodId);
      });
      if (state.period && periods.indexOf(state.period) < 0) periods.unshift(state.period);
      return periods.filter(Boolean);
    }

    function buildMonthlyRosterEntry(user, periodId, reportIndex) {
      var report = null;
      var keys = [
        String(user.user_id || '') + '::' + periodId,
        String(user.employee_name || '') + '::' + periodId,
        String(user.staff_code || '') + '::' + periodId
      ];
      for (var i = 0; i < keys.length; i += 1) {
        if (reportIndex[keys[i]]) {
          report = reportIndex[keys[i]];
          break;
        }
      }

      var status = report ? (report.status || 'draft') : 'missing';
      var detailBody = buildMonthlyDetailBody({
        branch_name: user.branch_name,
        employee_name: user.employee_name,
        role_type: user.role_type || user.title,
        status: status,
        submitted_at: report && report.submitted_at,
        reviewed_at: report && report.reviewed_at,
        review_note: report && report.review_note,
        review_history_text: report && report.review_history_text,
        data_summary: report && report.data_summary,
        score_summary: report && report.score_summary,
        next_step: report && report.next_step ? report.next_step : 'Please complete the report'
      });

      return {
        period_id: periodId,
        user_id: user.user_id,
        employee_name: user.employee_name || (report && report.employee_name) || '',
        branch_name: user.branch_name || (report && report.branch_name) || '',
        role_type: user.role_type || (report && report.role_type) || '',
        title: user.title || user.role_type || '',
        staff_code: user.staff_code || '',
        account: user.account || '',
        report_id: report && report.report_id ? report.report_id : '',
        status: status,
        submitted_at: report && report.submitted_at ? report.submitted_at : '',
        reviewed_at: report && report.reviewed_at ? report.reviewed_at : '',
        updated_at: report && report.updated_at ? report.updated_at : '',
        review_note: report && report.review_note ? report.review_note : '',
        review_history_text: report && report.review_history_text ? report.review_history_text : '',
        data_summary: report && report.data_summary ? report.data_summary : '',
        score_summary: report && report.score_summary ? report.score_summary : '',
        next_step: report && report.next_step ? report.next_step : '請完成月報',
        has_report: !!report,
        is_missing: !report,
        searchable: [
          user.employee_name,
          user.branch_name,
          user.role_type,
          user.title,
          user.staff_code,
          status,
          report && report.review_note,
          report && report.review_history_text,
          report && report.data_summary,
          report && report.score_summary
        ].filter(Boolean).join(' '),
        detail_body: detailBody
      };
    }

    function getMonthlyRosterEntries() {
      var roster = (data.monthly && data.monthly.submission_roster) || [];
      if (roster.length) return roster;

      var userDirectory = (data.monthly && data.monthly.user_directory) || [];
      var reports = (data.monthly && data.monthly.report_queue) || [];
      var reportIndex = getMonthlyReportIndex(reports);
      var periods = collectMonthlyRosterPeriods(reports, roster);
      var entries = [];

      periods.forEach(function (periodId) {
        userDirectory.forEach(function (user) {
          entries.push(buildMonthlyRosterEntry(user, periodId, reportIndex));
        });
      });

      return entries;
    }

    function getMonthlyContext() {
      var allRoster = getMonthlyRosterEntries();
      var periodRoster = allRoster.filter(periodMatches);
      var actualReports = ((data.monthly && data.monthly.report_queue) || []).filter(function (item) {
        return periodMatches(item) && branchMatches(item);
      });
      var masterBranches = getMasterBranchNames();
      var actualBranches = collectUniqueValues(periodRoster, 'branch_name');
      var branchSource = masterBranches.length ? masterBranches : actualBranches;

      var branchRows = branchSource.map(function (branchName) {
        var rows = periodRoster.filter(function (item) {
          return item.branch_name === branchName;
        });
        return {
          branch_name: branchName,
          period_id: state.period,
          expected_reports: rows.length,
          draft_reports: rows.filter(function (item) { return item.status === 'draft' || item.status === 'missing'; }).length,
          submitted_reports: rows.filter(function (item) { return item.status === 'submitted'; }).length,
          reviewed_reports: rows.filter(function (item) { return item.status === 'reviewed'; }).length,
          needs_revision_reports: rows.filter(function (item) { return item.status === 'needs_revision'; }).length,
          pending_total: rows.filter(function (item) { return item.status === 'draft' || item.status === 'missing' || item.status === 'needs_revision'; }).length,
          data_state: rows.length ? 'live' : 'pending_source'
        };
      });

      if (!branchRows.some(function (item) { return item.expected_reports > 0; }) && actualBranches.length) {
        branchSource = actualBranches;
        branchRows = branchSource.map(function (branchName) {
          var rows = periodRoster.filter(function (item) {
            return item.branch_name === branchName;
          });
          return {
            branch_name: branchName,
            period_id: state.period,
            expected_reports: rows.length,
            draft_reports: rows.filter(function (item) { return item.status === 'draft' || item.status === 'missing'; }).length,
            submitted_reports: rows.filter(function (item) { return item.status === 'submitted'; }).length,
            reviewed_reports: rows.filter(function (item) { return item.status === 'reviewed'; }).length,
            needs_revision_reports: rows.filter(function (item) { return item.status === 'needs_revision'; }).length,
            pending_total: rows.filter(function (item) { return item.status === 'draft' || item.status === 'missing' || item.status === 'needs_revision'; }).length,
            data_state: rows.length ? 'live' : 'pending_source'
          };
        });
      }

      var scopedBranchRows = isAllBranchSelected()
        ? branchRows
        : branchRows.filter(function (item) { return item.branch_name === state.branch; });

      var scopedRoster = isAllBranchSelected()
        ? periodRoster
        : periodRoster.filter(branchMatches);

      var scopedReports = actualReports.filter(function (item) {
        return branchMatches(item);
      });

      var sourceBranches = collectUniqueValues(periodRoster.concat(actualReports), 'branch_name')
        .filter(function (name) { return name !== getAllBranchLabel(); });
      var unmappedSourceBranches = sourceBranches.filter(function (name) {
        return masterBranches.indexOf(name) < 0;
      });

      return {
        branchRows: branchRows,
        scopedBranchRows: scopedBranchRows,
        queue: scopedReports,
        roster: scopedRoster,
        missingRoster: scopedRoster.filter(function (item) { return item.is_missing; }),
        reviewRoster: scopedRoster.filter(function (item) { return !item.is_missing; }),
        summary: summarizeMonthlyRows(scopedBranchRows),
        hasAlignedLiveData: scopedBranchRows.some(function (item) { return item.data_state === 'live'; }),
        unmappedSourceBranches: unmappedSourceBranches
      };
    }

    function getPayrollSummary() {
      var rows = filterItems((data.payroll && data.payroll.branch_progress) || []);
      if (rows.length) return summarizePayrollRows(rows);
      return (data.payroll && data.payroll.summary_all) || summarizePayrollRows([]);
    }

    function getPayrollTeacherHistories() {
      var grouped = {};
      var records = (data.payroll && data.payroll.payroll_records) || [];
      records.filter(function (item) {
        return !item.branch_name || isAllBranchSelected() || item.branch_name === state.branch;
      }).forEach(function (item) {
        var key = item.employee_id || item.employee_name;
        if (!grouped[key]) {
          grouped[key] = {
            employee_name: item.employee_name,
            branch_name: item.branch_name,
            payroll_grade: item.payroll_grade,
            records: []
          };
        }
        grouped[key].records.push(item);
      });

      return Object.keys(grouped).map(function (key) {
        var teacher = grouped[key];
        teacher.records = sortDescByPeriod(teacher.records);
        teacher.current_record = teacher.records.filter(function (item) {
          return item.period_id === state.period;
        })[0] || teacher.records[0] || {};
        teacher.confirmed_count = teacher.records.filter(function (item) {
          return item.confirm_status === 'confirmed';
        }).length;
        teacher.pending_count = teacher.records.length - teacher.confirmed_count;
        return teacher;
      }).sort(function (a, b) {
        return String(a.employee_name || '').localeCompare(String(b.employee_name || ''), 'en-US');
      });
    }

    function getOperationsContext() {
      var branchRows = filterItems((data.operations && data.operations.branch_compare) || []);
      return {
        summary: branchRows.length
          ? summarizeOperationsRows(branchRows)
          : ((data.operations && data.operations.summary_all) || summarizeOperationsRows([])),
        branchRows: branchRows,
        funnel: filterItems((data.operations && data.operations.funnel) || []),
        risks: filterItems((data.operations && data.operations.risks) || []),
        classHealth: filterItems((data.operations && data.operations.class_health) || []),
        actions: filterItems((data.operations && data.operations.actions) || [])
      };
    }

    function hasNonZeroClassSize(item) {
      var value = item.current_students;
      if (value === undefined || value === null || value === '') return true;
      return Number(value) !== 0;
    }

    function getHealthBand(item) {
      var score = Number(item.health_score || 0);
      if (score < 60) return 'red';
      if (score < 80) return 'yellow';
      return 'green';
    }

    function filterClassHealthByBand(items) {
      var filter = state.healthFilter || 'all';
      return items.filter(function (item) {
        return filter === 'all' || getHealthBand(item) === filter;
      });
    }

    function getOperationsCompareContext() {
      var preferredBranches = [getAllBranchLabel(), '安興分校', '二重分校'];
      var masterBranches = getMasterBranchNames();
      var compareBranches = preferredBranches.filter(function (name) {
        return masterBranches.indexOf(name) >= 0;
      });
      if (compareBranches.length < 2) compareBranches = masterBranches.slice(0, 2);

      var sourceRows = (data.operations && data.operations.branch_compare || []).filter(function (item) {
        return compareBranches.indexOf(item.branch_name) >= 0 && periodMatches(item);
      });

      return {
        branches: compareBranches,
        rows: compareBranches.map(function (branchName) {
          var matched = sourceRows.filter(function (item) {
            return item.branch_name === branchName;
          })[0];
          if (!matched) {
            return {
              branch_name: branchName,
              period_id: state.period,
              active_students: 0,
              new_students: 0,
              risk_count: 0,
              class_count: 0,

              trial_total: 0,
              transfer_count: 0,

              effective_calls: 0,

        })
      };

        '<section class="hero-panel glass"><div class="hero-top"><div><div class="brand-line"><span class="context-chip">在校 ' + summary.active_students + '</span><span class="context-chip">淨變動 ' + escapeHtml(formatSignedNumber(summary.net_change)) + '</span><span class="context-chip">試上 ' + summary.trial_total + '</span></div><h2>二重 / 安興 分校比較表</h2><p>營運頁聚焦二重與安興分校的比較、風險與後續動作。</p></div><div class="button-row"><button class="soft-btn" type="button" data-action="fake-export">匯出摘要</button><button class="primary-btn" type="button" data-route="home">回首頁</button></div></div><div class="hero-strip"><button class="hero-card clickable-card" type="button" data-detail-title="在校學生" data-detail-body="目前在校學生總數。" data-detail-meta="active=' + summary.active_students + '"><small>在校學生</small><strong>' + summary.active_students + '</strong></button><button class="hero-card clickable-card" type="button" data-detail-title="新增學生" data-detail-body="本期新增的學生數量。" data-detail-meta="new=' + summary.new_students + '"><small>新增學生</small><strong>' + summary.new_students + '</strong></button><button class="hero-card clickable-card" type="button" data-detail-title="班級數" data-detail-body="目前班級總數。" data-detail-meta="class=' + summary.class_count + '"><small>班級數</small><strong>' + summary.class_count + '</strong></button><button class="hero-card clickable-card" type="button" data-detail-title="風險 / 流失" data-detail-body="風險與流失學生對照。" data-detail-meta="risk=' + summary.risk_count + ' / lost=' + summary.lost_count + '"><small>風險 / 流失</small><strong>' + summary.risk_count + ' / ' + summary.lost_count + '</strong></button></div></section>' +
        '<section class="panel glass"><div class="panel-header"><div><h2>二重 / 安興 分校比較表</h2><p>並排比較兩個分校的主要營運指標。</p></div></div><div class="compare-card-row">' + (compareCards || '<div class="empty-state">目前沒有比較資料</div>') + '</div><div class="table-wrap"><table><thead><tr><th>指標</th><th>' + escapeHtml(compareContext.branches[0] || '分校 A') + '</th><th>' + escapeHtml(compareContext.branches[1] || '分校 B') + '</th><th>判讀</th></tr></thead><tbody>' + compareRows + '</tbody></table></div></section>' +
        '<section class="three-column"><article class="panel glass"><div class="panel-header"><div><h2>營運漏斗</h2><p>依營運階段查看數量。</p></div></div><div class="funnel">' + (funnelHtml || '<div class="empty-state">目前沒有漏斗資料</div>') + '</div></article><article class="panel glass"><div class="panel-header"><div><h2>風險清單</h2><p>需要留意的分校與班級。</p></div></div><div class="risk-list">' + (riskHtml || '<div class="empty-state">目前沒有風險資料</div>') + '</div></article><article class="panel glass"><div class="panel-header"><div><h2>班級健康度</h2><p>快速查看班級表現。</p></div><div class="health-filter-group">' + healthFilterHtml + '</div></div><div class="class-health">' + (healthHtml || '<div class="empty-state">目前沒有班級健康資料</div>') + '</div></article></section>' +
        '<section class="panel glass"><div class="panel-header"><div><h2>後續動作</h2><p>下一步需要處理的項目。</p></div></div><div class="action-list">' + (actionsHtml || '<div class="empty-state">目前沒有後續動作</div>') + '</div></section>'
      );
    }

    function renderRoute() {
      state.route = normalizeRoute(state.route || defaults.route);
      if (state.route === 'home') {
        state.scope = state.scope || 'all';
        dom.main.innerHTML = renderHome();
      } else if (state.route === 'monthly') {
        state.scope = 'monthly';
        dom.main.innerHTML = renderMonthly();
      } else if (state.route === 'payroll') {
        state.scope = 'payroll';
        dom.main.innerHTML = renderPayroll();
      } else {
        state.scope = 'operations';
        dom.main.innerHTML = renderOperations();
      }
    }

    function updateShell() {
      dom.routeLabels.forEach(function (el) {
        el.textContent = routeLabels[state.route] || '首頁';
      });
      dom.branches.forEach(function (el) {
        el.textContent = state.branch;
      });
      dom.periods.forEach(function (el) {
        el.textContent = state.period;
      });

      if (dom.dataSource) {
        var sourceLabel = (bootstrap.source && bootstrap.source.label) || '正式資料來源';
        var warnings = (bootstrap.source && bootstrap.source.warnings) || [];
        dom.dataSource.textContent = warnings.length ? sourceLabel + ' · ' + warnings.length + ' 筆提醒' : sourceLabel;
        dom.dataSource.title = warnings.join('\n');
      }

      dom.routeLinks.forEach(function (link) {
        var targetRoute = normalizeRoute(link.getAttribute('data-route-link'));
        var active = targetRoute === state.route;
        link.href = buildShareUrl({ route: targetRoute });
        if (publicWebAppUrl) link.target = '_top';
        link.classList.toggle('active', active);
        if (active) link.setAttribute('aria-current', 'page');
        else link.removeAttribute('aria-current');
      });

      dom.scopeLinks.forEach(function (button) {
        var target = button.getAttribute('data-scope-link');
        var active = state.route === 'home' ? state.scope === target : target === state.route;
        button.classList.toggle('active', active);
      });
    }

    function hydrateFilterControls() {
      var branchOptions = (data.shared && data.shared.branches) || [];
      var periodOptions = (data.shared && data.shared.periods) || [];

      dom.branch.innerHTML = branchOptions.map(function (item) {
        return '<option value="' + escapeHtml(item.branch_name) + '">' + escapeHtml(item.branch_name) + '</option>';
      }).join('');

      dom.period.innerHTML = periodOptions.map(function (item) {
        return '<option value="' + escapeHtml(item.period_id) + '">' + escapeHtml(item.label || item.period_id) + '</option>';
      }).join('');

      state.branch = ensureSelectedValue(
        state.branch,
        branchOptions.map(function (item) { return item.branch_name; }),
        defaults.branch || getAllBranchLabel()
      );
      state.period = ensureSelectedValue(
        state.period,
        periodOptions.map(function (item) { return item.period_id; }),
        defaults.period
      );

      dom.branch.value = state.branch;
      dom.period.value = state.period;
      dom.search.value = state.keyword;
    }

    function applyHomeScope() {
      if (state.route !== 'home') return;
      Array.prototype.slice.call(document.querySelectorAll('[data-module-section]')).forEach(function (node) {
        var group = node.getAttribute('data-module-section');
        node.hidden = state.scope !== 'all' && group !== 'all' && group !== state.scope;
      });
    }

    function applyKeyword() {
      var keyword = String(state.keyword || '').trim().toLowerCase();
      Array.prototype.slice.call(dom.main.querySelectorAll('[data-searchable], tr[data-searchable]')).forEach(function (node) {
        if (!keyword) {
          node.hidden = false;
          return;
        }
        node.hidden = String(node.getAttribute('data-searchable') || '').toLowerCase().indexOf(keyword) < 0;
      });
    }

    function applyDefaultDetail() {
      var target = dom.main.querySelector('[data-detail-default="1"]') || dom.main.querySelector('[data-detail-title]');
      if (!target) return;
      openDetail(
        target.getAttribute('data-detail-title'),
        target.getAttribute('data-detail-body'),
        target.getAttribute('data-detail-meta')
      );
    }

    function showSourceWarnings() {
      var warnings = (bootstrap.source && bootstrap.source.warnings) || [];
      if (!warnings.length) return;
      showToast('\u5171\u6709 ' + warnings.length + ' \u7b46\u8cc7\u6599\u63d0\u9192');
    }

    function renderApp() {
      hydrateFilterControls();
      renderRoute();
      updateShell();
      applyHomeScope();
      applyKeyword();
      applyDefaultDetail();
      localizeDom(document.body);
      syncUrlState(false);
      saveState();
    }

    function toggleModal(show) {
      if (!dom.modal) return;
      dom.modal.hidden = !show;
      document.body.classList.toggle('modal-open', !!show);
    }

    function copyShareUrl() {
      var url = buildShareUrl();
      if (!navigator.clipboard || !navigator.clipboard.writeText) {
        showToast('Clipboard is unavailable');
        return;
      }
      navigator.clipboard.writeText(url)
        .then(function () { showToast('Share link copied'); })
        .catch(function () { showToast('Copy failed'); });
    }

    function navigateTo(route) {
      var nextRoute = normalizeRoute(route);
      if (publicWebAppUrl && window.top && window.top !== window) {
        window.top.location.href = buildShareUrl({ route: nextRoute });
        return;
      }
      state.route = nextRoute;
      saveState();
      syncUrlState(true);
      renderApp();
    }

    function bindEvents() {
      if (dom.branch) {
        dom.branch.addEventListener('change', function () {
          state.branch = dom.branch.value;
          renderApp();
        });
      }
      if (dom.period) {
        dom.period.addEventListener('change', function () {
          state.period = dom.period.value;
          renderApp();
        });
      }
      if (dom.search) {
        dom.search.addEventListener('input', function () {
          state.keyword = dom.search.value;
          applyKeyword();
          syncUrlState(false);
          saveState();
        });
      }

      window.addEventListener('popstate', function () {
        state = mergeState(mergeState(mergeState(defaults, loadState()), requestedState), readUrlState());
        renderApp();
      });
      window.addEventListener('hashchange', function () {
        state = mergeState(mergeState(mergeState(defaults, loadState()), requestedState), readUrlState());
        renderApp();
      });

      document.addEventListener('click', function (event) {
        var routeLinkNode = event.target.closest('[data-route-link]');
        if (routeLinkNode) {
          if (publicWebAppUrl) return;
          event.preventDefault();
          navigateTo(routeLinkNode.getAttribute('data-route-link'));
          return;
        }

        var routeNode = event.target.closest('[data-route]');
        if (routeNode) {
          navigateTo(routeNode.getAttribute('data-route'));
          return;
        }

        var scopeNode = event.target.closest('[data-scope-link]');
        if (scopeNode) {
          var scope = scopeNode.getAttribute('data-scope-link');
          if (state.route === 'home') {
            state.scope = scope;
            updateShell();
            applyHomeScope();
            saveState();
          } else {
            navigateTo(scope === 'all' ? 'home' : scope);
          }
          return;
        }

        var healthFilterNode = event.target.closest('[data-health-filter]');
        if (healthFilterNode) {
          state.healthFilter = healthFilterNode.getAttribute('data-health-filter') || 'all';
          renderApp();
          return;
        }

        var detailNode = event.target.closest('[data-detail-title]');
        if (detailNode) {
          openDetail(
            detailNode.getAttribute('data-detail-title'),
            detailNode.getAttribute('data-detail-body'),
            detailNode.getAttribute('data-detail-meta')
          );
        }

        if (event.target.closest('[data-open-settings]')) {
          toggleModal(true);
          return;
        }
        if (event.target.closest('[data-close-settings]')) {
          toggleModal(false);
          return;
        }
        if (event.target.closest("[data-action='refresh-data']")) {
          showToast('Refreshing data');
          window.location.reload();
          return;
        }
        if (event.target.closest("[data-action='save-view']")) {
          saveState();
          copyShareUrl();
          return;
        }
        if (event.target.closest("[data-action='fake-export']")) {
          showToast('Export entry opened');
          return;
        }
        if (event.target.closest('[data-todo-toggle]')) {
          var todoItem = event.target.closest('.todo-item');
          if (todoItem) todoItem.classList.toggle('is-done');
        }
      });
    }

    bindEvents();
    renderApp();
    showSourceWarnings();
  })();
</script>
